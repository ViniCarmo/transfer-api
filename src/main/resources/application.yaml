spring:
  application:
    name: transfer-api
  datasource:
    url: jdbc:postgresql://localhost:5433/transfer
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  server:
    error:
      include-stacktrace: never

